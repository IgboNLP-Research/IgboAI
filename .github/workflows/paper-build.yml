name: Build paper PDF

on:
  push:
    paths: ["paper/**"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper

      - name: Upload PDF as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: igboai-paper
          path: paper/main.pdf

      - name: Attach PDF to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp paper/main.pdf "igboai-paper-${{ github.event.release.tag_name }}.pdf"
          gh release upload "${{ github.event.release.tag_name }}" \
            "igboai-paper-${{ github.event.release.tag_name }}.pdf" --clobber
