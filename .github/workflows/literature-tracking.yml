name: Nightly Igbo NLP literature & model tracking

on:
  schedule:
    - cron: "0 5 * * *" # 05:00 UTC daily — PR waiting by breakfast
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "How many days back to scan"
        default: "2"
      max_turns:
        description: "Max Claude turns for this run"
        default: "25"
      force_provider:
        description: "Override provider selection (for testing the fallback path)"
        type: choice
        options: [auto, openrouter, anthropic]
        default: auto

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: literature-tracking
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Deterministic layer: fetch + dedupe against .github/tracking/seen.json
      - name: Fetch candidates from arXiv and HF Hub
        run: python scripts/fetch_candidates.py "${{ github.event.inputs.lookback_days || '2' }}"

      - name: Check for new candidates
        id: gate
        run: |
          COUNT=$(python -c "import json; print(len(json.load(open('candidates.json'))))")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      # Routing layer: spend OpenRouter credits first, fall back to the personal
      # Anthropic key. Runs only when there is work to do, so a quiet night still
      # costs nothing. Fails the job if neither key is usable.
      - name: Choose provider
        id: route
        if: steps.gate.outputs.count != '0'
        env:
          OPENROUTER_API_KEY: ${{ github.event.inputs.force_provider != 'anthropic' && secrets.OPENROUTER_API_KEY || '' }}
          ANTHROPIC_API_KEY: ${{ github.event.inputs.force_provider != 'openrouter' && secrets.ANTHROPIC_API_KEY || '' }}
        run: python scripts/select_provider.py

      # LLM layer: relevance filtering, summarization, PR authoring
      - name: Summarize and file PR with Claude Code
        if: steps.gate.outputs.count != '0'
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: ${{ steps.route.outputs.base_url }}
          ANTHROPIC_MODEL: ${{ steps.route.outputs.model }}
          ANTHROPIC_SMALL_FAST_MODEL: ${{ steps.route.outputs.small_model }}
          ANTHROPIC_API_KEY: ${{ steps.route.outputs.use_openrouter == 'true' && secrets.OPENROUTER_API_KEY || secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ steps.route.outputs.use_openrouter == 'true' && secrets.OPENROUTER_API_KEY || '' }}
        with:
          prompt: |
            You are maintaining the literature tracker for IgboAI, a research
            project on Igbo-language NLP (low-resource setting).

            STEP 0 — DO THIS FIRST, BEFORE READING OR JUDGING ANYTHING.
            Create a branch named tracking/<today's date>. Make an empty commit
            (git commit --allow-empty -m "chore: begin tracking run <date>"),
            push the branch, and open a PR titled
            "Literature tracking: <date> (in progress)" whose body says the run
            is underway and the summary will follow. Every step below pushes to
            this same branch and updates this same PR. Do not defer PR creation
            until the end: if you run out of turns later, this PR is the only
            record of what was done.

            Read candidates.json in the repo root. For each item, judge whether
            it is genuinely relevant to Igbo NLP or closely transferable
            African/low-resource NLP work. Discard generic low-resource papers
            with no plausible transfer value; be selective.

            For each KEPT item, append an entry to related-work/<YYYY-MM>.md
            (create the file with a "# Related work — <Month Year>" heading if
            absent; newest entries first under a dated subheading) formatted:
            - **Title** — type: paper|model|dataset · source/venue · date ·
              tags: [mt|asr|tts|ner|sentiment|llm|corpus|method|eval] ·
              languages: [...]
              2–3 sentence summary for an NLP researcher (paraphrase, never
              copy abstract sentences), then on its own line:
              *Igbo relevance:* one concrete sentence (data, transfer,
              evaluation, or tooling). Link the URL.
            Append the same entry as one JSON object per line to
            related-work/entries.jsonl with keys: id, title, type, url,
            source, date, tags, languages, summary, igbo_relevance.
            Keep RELATED_WORK.md as a short index: a link per monthly file
            plus total entry counts; update it when a new monthly file is
            created.

            Relevance bar: keep work on Igbo or other African languages, and
            non-African low-resource work ONLY if its method or finding
            plausibly transfers to Igbo (e.g. tonal ASR, data-efficient
            training, cross-lingual transfer techniques). Discard resource
            papers for unrelated languages (e.g. a Vietnamese or Khmer corpus
            with no methodological contribution).

            In the PR body, list DISCARDED items too: one line each — title,
            source, URL — under a "Discarded" heading. No summaries needed.

            Then update .github/tracking/seen.json: add the "id" of EVERY item
            in candidates.json (kept and discarded). Create it as a JSON array
            if absent. Do NOT commit candidates.json itself.

            When every candidate has been processed, finalise the PR created in
            Step 0: retitle it "Literature tracking: <date> (<N> new items)" and
            rewrite the body to list the kept items plus a one-line note of how
            many were discarded as irrelevant. Use conventional commit messages
            throughout.

            Work incrementally: process candidates in batches of ~10. After
            each batch, update RELATED_WORK.md and seen.json for that batch,
            commit, and push to the branch created in Step 0. If you
            sense you are running low on turns, stop starting new batches,
            ensure everything processed so far is committed and pushed, and
            note in the PR body how many candidates were left unprocessed.

            If, after filtering, NOTHING is worth keeping, still update and push
            seen.json, then retitle the PR
            "Literature tracking: <date> (no relevant items)".
          claude_args: |
            --max-turns ${{ github.event.inputs.max_turns || '25' }}
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git:*),Bash(gh pr:*),Bash(python:*),Bash(python3:*),Bash(ls:*),Bash(mkdir:*),Bash(cat:*),Bash(date:*)"
            
      - name: Record which provider served this run
        if: always() && steps.gate.outputs.count != '0'
        run: |
          echo "Provider: ${{ steps.route.outputs.provider || 'not selected' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Model: ${{ steps.route.outputs.model || 'n/a' }}" >> "$GITHUB_STEP_SUMMARY"

      - name: No new candidates
        if: steps.gate.outputs.count == '0'
        run: echo "Nothing new since last run — no Claude invocation, zero API spend."
