name: Weekly corpus ingestion

on:
  schedule:
    - cron: "0 4 * * 0" # Sundays 04:00 UTC — before the 05:00 literature run
  workflow_dispatch:
    inputs:
      mode:
        description: "Which sources to fetch"
        type: choice
        options: [all, wikipedia, hf, news]
        default: all
      max_pages:
        description: "Max Wikipedia pages per language this run"
        default: "500"
      max_turns:
        description: "Max Claude turns for this run"
        default: "50"
      force_provider:
        description: "Override provider selection (for testing the fallback path)"
        type: choice
        options: [auto, openrouter, anthropic]
        default: auto

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: corpus-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch sources (deterministic layer)
        run: >
          python scripts/corpus_fetch.py
          "${{ github.event.inputs.mode || 'all' }}"
          "${{ github.event.inputs.max_pages || '500' }}"

      - name: Check whether anything was fetched
        id: gate
        run: |
          NEW=$(python - <<'EOF'
          import json
          s = json.load(open("corpus_run_summary.json"))
          n = 0
          for v in (s.get("wikipedia") or {}).values():
              n += v.get("documents", 0)
          n += len((s.get("hf_catalog") or {}).get("new_since_last_run", []))
          for v in (s.get("news") or {}).values():
              n += v.get("new_urls", 0)
          if (s.get("hf_catalog") or {}).get("fetch_failed"):
              n += 1
          print(n)
          EOF
          )
          echo "count=$NEW" >> "$GITHUB_OUTPUT"

      # Routing layer: spend OpenRouter credits first, fall back to the personal
      # Anthropic key. Runs only when there is work to do. Fails the job if
      # neither key is usable.
      - name: Choose provider
        id: route
        if: steps.gate.outputs.count != '0'
        env:
          OPENROUTER_API_KEY: ${{ github.event.inputs.force_provider != 'anthropic' && secrets.OPENROUTER_API_KEY || '' }}
          ANTHROPIC_API_KEY: ${{ github.event.inputs.force_provider != 'openrouter' && secrets.ANTHROPIC_API_KEY || '' }}
        run: python scripts/select_provider.py

      - name: Triage, document, and open PR with Claude Code
        if: steps.gate.outputs.count != '0'
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: ${{ steps.route.outputs.base_url }}
          ANTHROPIC_MODEL: ${{ steps.route.outputs.model }}
          ANTHROPIC_SMALL_FAST_MODEL: ${{ steps.route.outputs.small_model }}
          ANTHROPIC_API_KEY: ${{ steps.route.outputs.use_openrouter == 'true' && secrets.OPENROUTER_API_KEY || secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ steps.route.outputs.use_openrouter == 'true' && secrets.OPENROUTER_API_KEY || '' }}
        with:
          show_full_output: true
          prompt: |
            You are the corpus curation assistant for IgboAI. Read
            corpus_run_summary.json in the repo root; it describes what this
            run fetched. Also read CLAUDE.md for project scope.
            Git and gh are already authenticated by the workflow. Do not run
            gh auth status or otherwise verify credentials; go straight to work.
            Prefer single-purpose commands over chains joined by &&, ;, or |:
            each part of a chain is permission-checked separately, so a chain
            fails if any component is not allowed.

            YOUR ROLE IS QUALITY TRIAGE AND DOCUMENTATION, NOT DATA EDITING.
            Never modify, delete, or rewrite files under corpus/raw/ or
            corpus/manifests/ — the deterministic layer owns those. You write
            data cards, review notes, and the PR.

            0. FIRST, before any analysis: create branch corpus/<today's date>,
               commit a placeholder note to corpus/cards/README.md if nothing
               else has changed yet, push, and open a PR titled
               "Corpus ingestion: <date> (in progress)" with a body saying work
               is underway. Everything below then pushes to that same branch and
               updates the PR body as you go.

               EFFICIENCY: each raw file should be opened once. Before triaging,
               write a single Python script that walks every file this run produced
               and prints, per document: title, character count, diacritic ratio,
               and the first 500 characters. Run it once and work from that output.
               Do not re-open a .jsonl.gz to compute one more statistic; add the
               statistic to the script and rerun it only if genuinely necessary.
               Read `candidates.json` once at the start and work from that content;
               do not re-read it between batches.

            1. Wikipedia batches: inspect the "samples" excerpts and stats in
               the summary. Flag in your review notes anything that looks like
               wrong-language text, machine-translation artifacts, boilerplate,
               encoding damage, or implausible diacritic ratios (Igbo prose
               normally contains ị/ọ/ụ/ṅ; a near-zero ratio in a large batch
               is suspicious, though short factual stubs can be diacritic-light).
               Do not judge from stats alone; cite specific sample evidence.

            2. Create or update corpus/cards/<source>.md for each source that
               produced output this run. A data card contains: source and
               method of collection, license and attribution requirements,
               update cadence, cumulative size (documents/tokens; add this
               run's stats to any existing totals in the card), known
               limitations and quality flags (dated), and intended uses.

            3. Update corpus/cards/hf_catalog.md with notable NEW datasets
               from the catalog (license, languages, why relevant), and flag
               any with UNKNOWN license as "verify before use".

            4. When the work is complete, update the PR title to
               "Corpus ingestion: <date>" and rewrite the body to contain:
               per-source what-was-fetched numbers, your quality flags with
               sample citations, any items needing human license verification,
               and a checklist of decisions the reviewer must make. If the
               summary shows a Wikipedia backfill still in progress
               (backfill_done: false), say so and note that subsequent runs
               will continue it.

            Work incrementally and push after each card you complete. If you are
            running low on turns, stop starting new work, push what is finished,
            and note what remains in the PR body.
          claude_args: |
            --max-turns ${{ github.event.inputs.max_turns || '50' }}
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git:*),Bash(gh pr:*),Bash(gh auth status),Bash(python:*),Bash(python3:*),Bash(ls:*),Bash(mkdir:*),Bash(cat:*),Bash(echo:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(date:*)"

      - name: Record which provider served this run
        if: always() && steps.gate.outputs.count != '0'
        run: |
          echo "Provider: ${{ steps.route.outputs.provider || 'not selected' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Model: ${{ steps.route.outputs.model || 'n/a' }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit fetched data even if nothing to triage
        if: steps.gate.outputs.count == '0'
        run: echo "No new corpus material this run."
